<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F5" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Room8 is the roommate matching app built for college students. Verify with your .edu email and match on sleep schedules, study habits, cleanliness and noise." />
    <link rel="canonical" href="https://swiperoom8.com/" />

    <!-- Share previews (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Room8" />
    <meta property="og:title" content="Room8 - Find Your People" />
    <meta property="og:description" content="The roommate matching app built for college students. Verify with your .edu email and match on how you actually live. Free for students." />
    <meta property="og:url" content="https://swiperoom8.com/" />
    <meta property="og:image" content="https://swiperoom8.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Room8: Find Your People. The roommate matching app built for college students." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Room8 - Find Your People" />
    <meta name="twitter:description" content="The roommate matching app built for college students. Verify with your .edu email. Free for students." />
    <meta name="twitter:image" content="https://swiperoom8.com/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Room8",
        "url": "https://swiperoom8.com/",
        "logo": "https://swiperoom8.com/icon-512.png",
        "founder": [
          { "@type": "Person", "name": "Alexia Fabian" },
          { "@type": "Person", "name": "Lilla Tillo" }
        ],
        "sameAs": ["https://github.com/fabianalexia/Room8"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Room8",
        "applicationCategory": "LifestyleApplication",
        "applicationSubCategory": "Roommate matching",
        "operatingSystem": "Web browser (iPhone, Android, laptop)",
        "url": "https://swiperoom8.com/",
        "description": "Roommate matching app for college students. Students verify with their school .edu email and match on sleep schedules, study habits, cleanliness and noise tolerance.",
        "audience": { "@type": "EducationalAudience", "educationalRole": "student" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Free for students" }
      }
    </script>

    <title>Room8 - Find Your People</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
