name: Android build

on:
  push:
    branches: [main]
    paths:
      - "room8-frontend/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "room8-frontend/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: room8-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: room8-frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: https://room8-4dq7.onrender.com
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Copy web app into Android project
        run: npx cap sync android

      # Firebase config for push notifications, once it's added as a repo secret
      - name: Add google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build debug APK
        working-directory: room8-frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: room8-debug-apk
          path: room8-frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
